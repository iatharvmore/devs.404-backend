name: Dashboard - generate

on:
  repository_dispatch:
    types: [generate]

permissions:
  contents: write   # needed to commit the status file back

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_TTS_MODEL: bulbul:v3
          SARVAM_TTS_SPEAKER: shubh
          SARVAM_TTS_LANGUAGE: hi-IN
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_API_VERSION: v21.0
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python scripts/generate_job.py

      - name: Commit status file
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add status/
          git diff --staged --quiet || git commit -m "status: generate ${{ github.event.client_payload.job_id }}"
          git pull --rebase origin main
          git push
