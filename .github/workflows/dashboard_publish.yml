name: Dashboard - publish

on:
  repository_dispatch:
    types: [publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Mark job as publishing
        run: |
          python3 -c "import json, pathlib; p = pathlib.Path('status/${{ github.event.client_payload.job_id }}.json'); data = json.loads(p.read_text()) if p.exists() else {'job_id': '${{ github.event.client_payload.job_id }}'}; data['status'] = 'publishing'; p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(data, indent=2))"
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add status/
          git diff --staged --quiet || (git commit -m "status: publishing ${{ github.event.client_payload.job_id }}" && git pull --rebase origin main && git push)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Publish to Instagram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_API_VERSION: v21.0
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python scripts/publish_job.py

      - name: Commit status file
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "actions@github.com"
          git add status/
          if ! git diff --staged --quiet; then
            git commit -m "status: publish completed ${{ github.event.client_payload.job_id }}"
            for i in {1..5}; do
              git pull --rebase origin main && git push && break || sleep 2
            done
          fi
